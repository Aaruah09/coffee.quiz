<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VASASI Challenge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="brand">VASASI</div>
<div id="app">Loading...</div>

<script>
const TOTAL_QUESTIONS = 8;

const welcomeMessages = [
 ["🎯 Think you know coffee?","Most visitors don't finish with a perfect score."],
 ["☕ Waiting for your order?","Let's make those few minutes worth it."],
 ["🏆 Only a few unlock today's reward.","Ready to try?"],
 ["⚡ 8 questions. One reward.","Let's see what you've got."],
 ["☕ Your coffee is brewing...","Challenge accepted?"]
];

const quizComments = [
 "👀 No Googling...",
 "☕ Trust your instincts.",
 "🎯 Most visitors miss this one.",
 "⚡ First answer, best answer.",
 "🧠 Honest answers taste better.",
 "😏 Easier than it looks."
];

const failMessages = [
 "☕ Not bad at all. You got closer than most visitors.",
 "⚡ Fast thinker. Next time might be the winning run.",
 "🎯 You were closer than you think.",
 "☕ Fresh questions await next time.",
 "🔥 Good effort. See you again soon."
];

let allQuestions=[];
let questions=[];
let current=0;
let score=0;

async function init(){
 try{
   const res = await fetch("questions.json");
   allQuestions = await res.json();
   showHome();
 }catch(e){
   document.getElementById("app").innerHTML =
   "<h2>questions.json not found</h2>";
 }
}

function shuffle(arr){
 return [...arr].sort(()=>Math.random()-0.5);
}

function randomItem(arr){
 return arr[Math.floor(Math.random()*arr.length)];
}

function showHome(){

 const nextPlay = localStorage.getItem("nextPlay");

 if(nextPlay && Date.now() < Number(nextPlay)){
   showCooldown();
   return;
 }

 const msg = randomItem(welcomeMessages);

 document.getElementById("app").innerHTML = `
 <h2>${msg[0]}</h2>
 <p>${msg[1]}</p>
 <button onclick="showNamePage()">Start Challenge</button>
 `;
}

function showNamePage(){

 const saved = localStorage.getItem("playerName") || "";

 document.getElementById("app").innerHTML = `
 <h2>What's your name?</h2>
 <input id="name" placeholder="Your name" value="${saved}">
 <button onclick="startQuiz()">Continue</button>
 `;
}

function startQuiz(){

 const name = document.getElementById("name").value.trim();

 if(!name){
   alert("Enter your name");
   return;
 }

 localStorage.setItem("playerName",name);

 questions = shuffle(allQuestions).slice(0,TOTAL_QUESTIONS);

 current=0;
 score=0;

 showQuestion();
}

function showQuestion(){

 const q = questions[current];
 const keys = Object.keys(q.options);
 const comment = randomItem(quizComments);

 let html = `
 <div class="progress-text">${current+1}/${TOTAL_QUESTIONS}</div>

 <div class="progress-bar">
   <div class="progress-fill"
   style="width:${((current)/TOTAL_QUESTIONS)*100}%">
   </div>
 </div>

 <p class="quiz-comment">${comment}</p>

 <h3>${q.question}</h3>
 `;

 keys.forEach(key=>{
   html += `
   <button data-key="${key}"
   onclick="checkAnswer('${key}',this)">
   <strong>${key}.</strong> ${q.options[key]}
   </button>`;
 });

 document.getElementById("app").innerHTML = html;
}

function checkAnswer(selected,btn){

 const correct = questions[current].correctAnswer;

 const buttons =
 document.querySelectorAll("#app button");

 buttons.forEach(b=>b.disabled=true);

 if(selected===correct){
   btn.classList.add("correct");
   score++;
 }else{
   btn.classList.add("wrong");

   buttons.forEach(b=>{
     if(b.dataset.key===correct){
       b.classList.add("correct");
     }
   });
 }

 setTimeout(()=>{
   current++;

   if(current<TOTAL_QUESTIONS){
     showQuestion();
   }else{
     showResult();
   }
 },1000);
}

function showResult(){

 localStorage.setItem(
   "nextPlay",
   Date.now() + (10 * 1000)
 );

 if(score===8){

   document.getElementById("app").innerHTML = `
   <h2>🏆 Coffee Master</h2>

   <div class="reward">
   Reward Unlocked
   </div>

   <p>Show this screen at the counter.</p>

   <div id="timer"></div>
   `;

 }else{

   document.getElementById("app").innerHTML = `
   <h2>Challenge Complete</h2>

   <div class="reward">${score}/8</div>

   <p>${randomItem(failMessages)}</p>

   <div id="timer"></div>
   `;
 }

 startTimer();
}

function showCooldown(){

 const name =
 localStorage.getItem("playerName") || "Friend";

 document.getElementById("app").innerHTML = `
 <h2>Welcome back, ${name}!</h2>

 <p>Your next challenge unlocks in</p>

 <div id="timer"></div>
 `;

 startTimer();
}

function startTimer(){

 const interval = setInterval(()=>{

   const nextPlay =
   Number(localStorage.getItem("nextPlay"));

   const remaining = nextPlay - Date.now();

   if(remaining<=0){
     clearInterval(interval);
     localStorage.removeItem("nextPlay");
     showHome();
     return;
   }

   const s = Math.floor((remaining/1000)%60);

   document.getElementById("timer").innerText =
   s + "s";

 },1000);
}

init();
</script>

</body>
</html>
