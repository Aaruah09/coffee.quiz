<!DOCTYPE html>
<html>
<head>
  <title>Coffee Quiz ☕</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    body{
      margin:0;
      font-family:'Poppins',sans-serif;
      background:linear-gradient(135deg,#f5f5f5,#e6d3c3);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    #app{
      background:white;
      padding:30px;
      border-radius:16px;
      width:90%;
      max-width:350px;
      text-align:center;
      box-shadow:0 10px 25px rgba(0,0,0,.1);
    }
    input{
      width:100%;
      padding:12px;
      margin:8px 0;
      border:1px solid #ddd;
      border-radius:10px;
      box-sizing:border-box;
    }
    button{
      width:100%;
      padding:12px;
      margin:8px 0;
      border:none;
      border-radius:10px;
      background:#6f4e37;
      color:white;
      cursor:pointer;
    }
    .correct{background:#4CAF50!important;}
    .wrong{background:#f44336!important;}
    #timer{font-size:28px;font-weight:bold;}
  </style>
</head>
<body>
<div id="app"></div>

<script>
let allQuestions=[
{q:"Espresso is?",options:["Strong coffee","Cold drink","Tea"],answer:"Strong coffee"},
{q:"Which coffee has more milk?",options:["Latte","Espresso","Black coffee"],answer:"Latte"},
{q:"Coffee was first discovered in?",options:["India","Ethiopia","USA"],answer:"Ethiopia"},
{q:"Cold brew is served?",options:["Hot","Cold","Frozen"],answer:"Cold"},
{q:"Which is strongest?",options:["Americano","Espresso","Latte"],answer:"Espresso"},
{q:"Cappuccino contains?",options:["Milk foam","Ice cream","Chocolate only"],answer:"Milk foam"}
];

let questions=[];
let current=0;
let score=0;

function shuffle(arr){
 return arr.sort(()=>Math.random()-0.5);
}

function getRandomQuestions(){
 return shuffle([...allQuestions]).slice(0,3);
}

function showStart(){
 let nextPlay=localStorage.getItem("nextPlay");

 if(nextPlay && Date.now()<Number(nextPlay)){
   showCooldown();
   return;
 }

 document.getElementById("app").innerHTML=`
 <h2>☕ Coffee Quiz</h2>
 <p>Enter your details to play</p>

 <input id="name" placeholder="Your Name">
 <input id="mobile" maxlength="10" placeholder="Mobile Number">

 <button onclick="startQuiz()">Start Quiz</button>
 `;
}

function startQuiz(){
 let name=document.getElementById("name").value.trim();
 let mobile=document.getElementById("mobile").value.trim();

 if(name===""){
   alert("Enter your name");
   return;
 }

 if(!/^[0-9]{10}$/.test(mobile)){
   alert("Enter a valid 10 digit mobile number");
   return;
 }

 questions=getRandomQuestions();
 current=0;
 score=0;
 showQuestion();
}

function showQuestion(){
 let q=questions[current];
 let options=shuffle([...q.options]);

 let html=`<h3>${q.q}</h3>`;

 options.forEach(opt=>{
   html+=`<button onclick="checkAnswer('${opt}',this)">${opt}</button>`;
 });

 document.getElementById("app").innerHTML=html;
}

function checkAnswer(selected,btn){
 let correct=questions[current].answer;

 let buttons=document.querySelectorAll("button");
 buttons.forEach(b=>b.disabled=true);

 if(selected===correct){
   btn.classList.add("correct");
   score++;
 }else{
   btn.classList.add("wrong");
   buttons.forEach(b=>{
     if(b.innerText===correct){
       b.classList.add("correct");
     }
   });
 }

 setTimeout(()=>{
   current++;
   if(current<questions.length){
     showQuestion();
   }else{
     showResult();
   }
 },800);
}

function showResult(){

 let reward="";

 if(score===3) reward="₹10 OFF 🎉";
 else if(score===2) reward="₹5 OFF 👍";
 else reward="Try Again 😅";

 localStorage.setItem(
   "nextPlay",
   Date.now() + (8*60*60*1000)
 );

 document.getElementById("app").innerHTML=`
 <h2>🔥 You scored ${score}/3</h2>
 <h3>${reward}</h3>
 <p>Next quiz available in:</p>
 <div id="timer"></div>
 `;

 startTimer();
}

function showCooldown(){
 document.getElementById("app").innerHTML=`
 <h2>⏰ Already Played</h2>
 <p>Come back in:</p>
 <div id="timer"></div>
 `;

 startTimer();
}

function startTimer(){

 let interval=setInterval(()=>{

   let nextPlay=Number(localStorage.getItem("nextPlay"));
   let remaining=nextPlay-Date.now();

   if(remaining<=0){
     clearInterval(interval);
     localStorage.removeItem("nextPlay");
     showStart();
     return;
   }

   let h=Math.floor(remaining/3600000);
   let m=Math.floor((remaining%3600000)/60000);
   let s=Math.floor((remaining%60000)/1000);

   document.getElementById("timer").innerText=
   `${h}h ${m}m ${s}s`;

 },1000);
}

showStart();
</script>
</body>
</html>
