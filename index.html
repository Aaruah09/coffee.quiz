<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vasasi Cafe Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:'Outfit',sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#2d1b12,#6f4e37,#c08b5c);
}

#app{
width:92%;
max-width:420px;
background:rgba(255,255,255,.95);
backdrop-filter:blur(10px);
padding:28px;
border-radius:24px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.cafe{
font-size:32px;
font-weight:700;
color:#6f4e37;
margin-bottom:5px;
}

.tag{
color:#777;
margin-bottom:20px;
}

h2,h3{
color:#2d1b12;
}

input{
width:100%;
padding:14px;
border-radius:14px;
border:1px solid #ddd;
font-size:16px;
font-family:'Outfit',sans-serif;
margin:10px 0;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:#6f4e37;
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.2s;
margin-top:10px;
}

button:hover{
transform:translateY(-2px);
}

.correct{background:#4CAF50!important;}
.wrong{background:#f44336!important;}

.reward{
font-size:34px;
font-weight:700;
color:#6f4e37;
}

#timer{
font-size:28px;
font-weight:700;
margin-top:10px;
color:#6f4e37;
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const messages=[
["☕ Waiting for your order?","Let's make those few minutes worth it."],
["☕ Your coffee is brewing...","Ready for a quick challenge?"],
["⏳ Good coffee takes time.","Let's make the wait fun."],
["🎁 Got a minute?","You might unlock a reward."],
["☕ Fresh coffee. Fresh challenge.","Let's begin."],
["✨ A little challenge while you wait.","Your reward might be closer than you think."]
];

const allQuestions=[
{q:"Espresso is?",options:["Strong coffee","Cold drink","Tea"],answer:"Strong coffee"},
{q:"Which coffee has more milk?",options:["Latte","Espresso","Black coffee"],answer:"Latte"},
{q:"Coffee was first discovered in?",options:["India","Ethiopia","USA"],answer:"Ethiopia"},
{q:"Cold brew is served?",options:["Hot","Cold","Frozen"],answer:"Cold"},
{q:"Which is strongest?",options:["Americano","Espresso","Latte"],answer:"Espresso"},
{q:"Cappuccino contains?",options:["Milk foam","Ice cream","Chocolate only"],answer:"Milk foam"}
];

let questions=[];
let current=0;
let score=0;

function shuffle(arr){
return arr.sort(()=>Math.random()-0.5);
}

function showHome(){

const nextPlay=localStorage.getItem("nextPlay");

if(nextPlay && Date.now()<Number(nextPlay)){
showCooldown();
return;
}

const msg=messages[Math.floor(Math.random()*messages.length)];

document.getElementById("app").innerHTML=`
<div class="cafe">☕ Vasasi</div>
<div class="tag">Exclusive Cafe Challenge</div>

<h2>${msg[0]}</h2>
<p>${msg[1]}</p>

<button onclick="showNamePage()">Continue</button>
`;
}

function showNamePage(){

const saved=localStorage.getItem("playerName")||"";

document.getElementById("app").innerHTML=`
<div class="cafe">☕ Vasasi</div>

<h2>👋 What's your name?</h2>

<input id="name" placeholder="Enter your name" value="${saved}">

<button onclick="startQuiz()">Start Quiz</button>
`;
}

function startQuiz(){

const name=document.getElementById("name").value.trim();

if(name===""){
alert("Please enter your name");
return;
}

localStorage.setItem("playerName",name);

questions=shuffle([...allQuestions]).slice(0,3);
current=0;
score=0;

showQuestion();
}

function showQuestion(){

let q=questions[current];
let options=shuffle([...q.options]);

let html=`
<div class="cafe">☕ Vasasi</div>
<h3>Question ${current+1}/3</h3>
<p>${q.q}</p>
`;

options.forEach(opt=>{
html+=`<button onclick="checkAnswer('${opt}',this)">${opt}</button>`;
});

document.getElementById("app").innerHTML=html;
}

function checkAnswer(selected,btn){

let correct=questions[current].answer;

let buttons=document.querySelectorAll("button");
buttons.forEach(b=>b.disabled=true);

if(selected===correct){
btn.classList.add("correct");
score++;
}else{
btn.classList.add("wrong");

buttons.forEach(b=>{
if(b.innerText===correct){
b.classList.add("correct");
}
});
}

setTimeout(()=>{
current++;

if(current<questions.length){
showQuestion();
}else{
showResult();
}

},800);
}

function showResult(){

let reward="Try Again 😅";

if(score===3) reward="₹10 OFF 🎉";
else if(score===2) reward="₹5 OFF 👍";

localStorage.setItem("nextPlay",Date.now()+(8*60*60*1000));

const name=localStorage.getItem("playerName")||"Friend";

document.getElementById("app").innerHTML=`
<div class="cafe">☕ Vasasi</div>

<h2>🎉 Nice one, ${name}!</h2>

<p>You scored ${score}/3</p>

<div class="reward">${reward}</div>

<p><strong>☕ A little treat from us.</strong></p>

<p>Show this screen at the counter to claim your reward.</p>

<p>⏰ Next challenge unlocks in:</p>

<div id="timer"></div>
`;

startTimer();
}

function showCooldown(){

const name=localStorage.getItem("playerName")||"Friend";

document.getElementById("app").innerHTML=`
<div class="cafe">☕ Vasasi</div>

<h2>Welcome back, ${name}!</h2>

<p>Your next challenge unlocks in:</p>

<div id="timer"></div>
`;

startTimer();
}

function startTimer(){

const interval=setInterval(()=>{

const nextPlay=Number(localStorage.getItem("nextPlay"));
const remaining=nextPlay-Date.now();

if(remaining<=0){
clearInterval(interval);
localStorage.removeItem("nextPlay");
showHome();
return;
}

const h=Math.floor(remaining/3600000);
const m=Math.floor((remaining%3600000)/60000);
const s=Math.floor((remaining%60000)/1000);

document.getElementById("timer").innerText=`${h}h ${m}m ${s}s`;

},1000);
}

showHome();

</script>

</body>
</html>
