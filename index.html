<!DOCTYPE html>
<html>
<head>
  <title>Coffee Quiz ☕</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f5f5f5, #e6d3c3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #app {
      background: white;
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h2, h3 {
      margin-bottom: 20px;
      color: #333;
    }

    p {
      color: #777;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      background: #6f4e37;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #5a3e2b;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

<div id="app"></div>

<script>

// 🔥 Question bank
let allQuestions = [
  { q: "Espresso is?", options: ["Strong coffee", "Cold drink", "Tea"], answer: 0 },
  { q: "Which coffee has more milk?", options: ["Latte", "Espresso", "Black coffee"], answer: 0 },
  { q: "Coffee was first discovered in?", options: ["India", "Ethiopia", "USA"], answer: 1 },
  { q: "Cold brew is served?", options: ["Hot", "Cold", "Frozen"], answer: 1 },
  { q: "Which is strongest?", options: ["Americano", "Espresso", "Latte"], answer: 1 },
  { q: "Cappuccino contains?", options: ["Milk foam", "Ice cream", "Chocolate only"], answer: 0 }
];

// 🔀 Get random 3 questions
function getRandomQuestions() {
  let shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
  return shuffled.slice(0, 3);
}

let questions = [];
let current = 0;
let score = 0;

// 🟢 Start screen
function showStart() {
  document.getElementById("app").innerHTML = `
    <h2>☕ Coffee Quiz</h2>
    <p>3 quick questions. Win rewards.</p>
    <button onclick="startQuiz()">Start</button>
  `;
}

// 🚀 Start quiz
function startQuiz() {
  questions = getRandomQuestions(); // random set
  current = 0;
  score = 0;
  showQuestion();
}

// ❓ Show question
function showQuestion() {
  let q = questions[current];

  let optionsHTML = "";
  for (let i = 0; i < q.options.length; i++) {
    optionsHTML += `<button onclick="checkAnswer(${i})">${q.options[i]}</button>`;
  }

  document.getElementById("app").innerHTML = `
    <h3>${q.q}</h3>
    ${optionsHTML}
  `;
}

// ✅ Check answer
function checkAnswer(selected) {
  if (selected === questions[current].answer) {
    score++;
  }

  current++;

  if (current < questions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

// 🎉 Result screen
function showResult() {
  let reward = "";
  if (score === 3) reward = "₹10 OFF 🎉";
  else if (score === 2) reward = "₹5 OFF 👍";
  else reward = "Try Again 😅";

  document.getElementById("app").innerHTML = `
    <h2>🔥 You scored ${score}/3</h2>
    <h3>${reward}</h3>
    <button onclick="showStart()">Play Again</button>
  `;
}

// Load first screen
showStart();

</script>

</body>
</html>
