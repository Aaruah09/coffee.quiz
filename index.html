<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VASASI Challenge V3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="brand">VASASI</div>

<div id="toast"></div>
<div id="app">Loading...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>
  const supabaseUrl = "https://uuagsbpxjfspfiijjjup.supabase.co/";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1YWdzYnB4amZzcGZpaWpqanVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMjg2NzAsImV4cCI6MjA5NjkwNDY3MH0.S1HO488DvYVJBj4yq41fYYCJj20BUBI4m8byZvDhrM";
const supabase = window.supabase.createClient(
  supabaseUrl,
  supabaseKey
);

async function savePlay() {

const name =
localStorage.getItem("playerName")
|| "Guest";

await supabase
.from('plays')
.insert([
{
player_name: name,
score: score,
completed: true
}
]);

}

const TOTAL_QUESTIONS = 8;

const welcomeMessages = [
["☕ Your coffee is being prepared.","Think you know coffee better than our regulars?"],
["🍰 Something delicious is on the way.","Let's see if you can earn today's reward."],
["👨‍🍳 The kitchen is busy.","Your brain can be too."],
["☕ Fresh coffee takes a moment.","The challenge takes less than a minute."],
["🔥 Your order is getting ready.","Let's put your coffee knowledge to the test."],
["🍪 The snacks are almost ready.","Can you conquer today's challenge first?"],
["☕ Brewing in progress.","Challenge accepted?"]
];

const quizComments = [
"👀 No Googling...",
"☕ Trust your instincts.",
"🎯 Most visitors miss this one.",
"⚡ First answer, best answer.",
"🧠 Honest answers taste better.",
"😏 Easier than it looks.",
"🏆 Every point counts."
];

const failMessages = [
"☕ Not bad at all. You got closer than most visitors.",
"⚡ Fast thinker. Next time might be the winning run.",
"🎯 You were closer than you think.",
"☕ Fresh questions await next time.",
"🔥 Good effort. See you again soon."
];

let allQuestions=[];
let questions=[];
let current=0;
let score=0;

async function init(){
 try{
   const res = await fetch('questions.json');
   allQuestions = await res.json();
   showHome();
 }catch(e){
   document.getElementById('app').innerHTML =
   '<h2>questions.json not found</h2>';
 }
}

function randomItem(arr){
 return arr[Math.floor(Math.random()*arr.length)];
}

function shuffle(arr){
 return [...arr].sort(()=>Math.random()-0.5);
}

function showToast(text){

 const toast = document.getElementById('toast');

 toast.innerText = text;

 toast.classList.add('show');

 setTimeout(()=>{
   toast.classList.remove('show');
 },2000);
}

function showHome(){

 const nextPlay = localStorage.getItem('nextPlay');

 if(nextPlay && Date.now() < Number(nextPlay)){
   showCooldown();
   return;
 }

 const msg = randomItem(welcomeMessages);

 document.getElementById('app').innerHTML = `
 <h2>${msg[0]}</h2>

 <p>${msg[1]}</p>

 <button onclick="showNamePage()">
 Start Challenge
 </button>
 `;
}

function showNamePage(){

 const saved =
 localStorage.getItem('playerName') || '';

 document.getElementById('app').innerHTML = `
 <h2>What's your name?</h2>

 <input id="name"
 placeholder="Your name"
 value="${saved}">

 <button onclick="startQuiz()">
 Continue
 </button>
 `;
}

function startQuiz(){



 const name =
 document.getElementById('name').value.trim();

 if(!name){
   alert('Enter your name');
   return;
 }

 localStorage.setItem('playerName',name);

 questions =
 shuffle(allQuestions).slice(0,TOTAL_QUESTIONS);

 current = 0;
 score = 0;

 saveQuizStart();
showQuestion();
}

function showQuestion(){

 const q = questions[current];

 const keys = Object.keys(q.options);

 document.getElementById('app').innerHTML = `
 <div class="progress-text">
 ${current+1}/${TOTAL_QUESTIONS}
 </div>

 <div class="progress-bar">
   <div class="progress-fill"
  style="width:$(current/TOTAL_QUESTIONS)*100}%"></div>
 </div>

 <h3>${q.question}</h3>

 <div id="options"></div>
 `;

 const options =
 document.getElementById('options');

 keys.forEach(key=>{
   options.innerHTML += `
   <button data-key="${key}"
   onclick="checkAnswer('${key}',this)">
   <strong>${key}.</strong>
   ${q.options[key]}
   </button>`;
 });

 showToast(randomItem(quizComments));
}

function checkAnswer(selected,btn){

 const correct =
 questions[current].correctAnswer;

 const buttons =
 document.querySelectorAll('#options button');

 buttons.forEach(b=>b.disabled=true);

 if(selected===correct){
   btn.classList.add('correct');
   score++;
 }else{
   btn.classList.add('wrong');

   buttons.forEach(b=>{
     if(b.dataset.key===correct){
       b.classList.add('correct');
     }
   });
 }

 setTimeout(()=>{

   current++;

   if(current<TOTAL_QUESTIONS){
     showQuestion();
   }else{
     showResult();
   }

 },1000);
}

function showResult(){

saveQuizResult();

 localStorage.setItem(
 'nextPlay',
 Date.now() + (10*1000)
 );

 if(score===8){

 document.getElementById('app').innerHTML = `
 <h2>🏆 Coffee Master</h2>

 <div class="reward">
 Reward Unlocked
 </div>

 <p>Show this screen at the counter.</p>

 <div id="timer"></div>
 `;

 }else{

 document.getElementById('app').innerHTML = `
 <h2>Challenge Complete</h2>

 <div class="reward">${score}/8</div>

 <p>${randomItem(failMessages)}</p>

 <div id="timer"></div>
 `;

 }

 startTimer();
}

function showCooldown(){

 document.getElementById('app').innerHTML = `
 <h2>See you soon 👋</h2>

 <p>Fresh questions unlock shortly.</p>

 <div id="timer"></div>
 `;

 startTimer();
}

function startTimer(){

 const interval=setInterval(()=>{

 const nextPlay =
 Number(localStorage.getItem('nextPlay'));

 const remaining =
 nextPlay - Date.now();

 if(remaining<=0){
   clearInterval(interval);
   localStorage.removeItem('nextPlay');
   showHome();
   return;
 }

 const s =
 Math.floor((remaining/1000)%60);

 document.getElementById('timer').innerText =
 s + 's';

 },1000);
}

init();

</script>

</body>
</html>
