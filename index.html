<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>RED RABBIT Challenge V3</title>
<style>


</style>
</style>
</head>
<body>

<div class="brand">

<img src="rr.logo.png" class="logo">

<div class="brand-text">RED RABBIT</div>

<div class="brand-sub">CAFÉ</div>

</div>

<div id="toast"></div>
<div id="app">Loading...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// Supabase Configuration
const supabaseUrl = "https://uuagsbpxjfspfiijjjup.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1YWdzYnB4amZzcGZpaWpqanVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMjg2NzAsImV4cCI6MjA5NjkwNDY3MH0.S1HO488DvYVJBj4yq41fYYCJj20BUBI4m8byZvDhgrM";
let dbClient = null;

if (window.supabase) {
  dbClient = window.supabase.createClient(supabaseUrl, supabaseKey);
} else {
  console.error("Supabase CDN failed to load.");
}

// Analytics Write Execution
async function savePlay() {
  if (!dbClient) return;
  const name = localStorage.getItem("playerName") || "Guest";
  try {
    await dbClient.from('plays').insert([{ player_name: name, score: score, completed: true }]);
  } catch (dbError) {
    console.error("Database write failed:", dbError);
  }
}

const TOTAL_QUESTIONS = 8;
const MAX_ATTEMPTS = 2;

const welcomeMessages = [
  ["☕ Your coffee is being prepared.","Think you know coffee better than our regulars?"],
  ["🍰 Something delicious is on the way.","Let's see if you can earn today's reward."],
  ["👨‍🍳 The kitchen is busy.","Your brain can be too."],
  ["☕ Fresh coffee takes a moment.","The challenge takes less than a minute."],
  ["🔥 Your order is getting ready.","Let's put your coffee knowledge to the test."],
  ["🍪 The snacks are almost ready.","Can you conquer today's challenge first?"],
  ["☕ Brewing in progress.","Challenge accepted?"]
];

const quizComments = [
  "👀 No Googling...",
  "☕ Trust your instincts.",
  "🎯 Most visitors miss this one.",
  "⚡ First answer, best answer.",
  "🧠 Honest answers taste better.",
  "😏 Easier than it looks.",
  "🏆 Every point counts."
];

const failMessages = [
  "☕ Not bad at all. You got closer than most visitors.",
  "⚡ Fast thinker. Next time might be the winning run.",
  "🎯 You were closer than you think.",
  "☕ Fresh questions await next time.",
  "🔥 Good effort. See you again soon."
];

const retryMessages = [
  "☕ Ooh, that was close. One more shot?",
  "🎯 Most winners didn't win on their first attempt.",
  "🔥 Not bad at all. Try again before your coffee arrives.",
  "☕ One answer away? Let's find out.",
  "⚡ Round two might be your round."
];

let allQuestions=[];
let questions=[];
let current=0;
let score=0;
let attempts=0;

// Application Boot Sequence
async function init(){

try{

const res = await fetch('questions.json');

if(!res.ok)
throw new Error("File asset unreadable");

allQuestions = await res.json();

const savedQuiz =
localStorage.getItem('quizState');

if(savedQuiz){


 const state =
 JSON.parse(savedQuiz);

 current = state.current;
 score = state.score;
 attempts = state.attempts;
 questions = state.questions;

 showQuestion();


}else{


 showHome();


}

}catch(e){

document.getElementById('app').innerHTML = ` <h2 style="color: var(--danger);">
Critical Error </h2>


 <p>
   The system cannot find
   <strong>questions.json</strong>.
 </p>


`;

console.error(e);

}

}



function randomItem(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){ return [...arr].sort(()=>Math.random()-0.5); }

function showToast(text){
 const toast = document.getElementById('toast');
 toast.innerText = text;
 toast.classList.add('show');
 setTimeout(()=>{ toast.classList.remove('show'); },2000);
}

function showHome()

{
 const nextPlay = localStorage.getItem('nextPlay');
 if(nextPlay && Date.now() < Number(nextPlay)){
   showCooldown();
   return;
 }
 const msg = randomItem(welcomeMessages);
 document.getElementById('app').innerHTML = `
 <h2>${msg[0]}</h2>
 <p>${msg[1]}</p>
 <button onclick="showNamePage()">Start Challenge</button>
 `;
}

function showNamePage(){
 const saved = localStorage.getItem('playerName') || '';
 document.getElementById('app').innerHTML = `
 <h2>What's your name?</h2>
 <input id="name" placeholder="Your name" value="${saved}">
 <button onclick="startQuiz()">Continue</button>
 `;
}

function startQuiz(){
  localStorage.setItem(
'quizInProgress',
'true'
);

 const name = document.getElementById('name').value.trim();
 if(!name){ alert('Enter your name'); return; }
 localStorage.setItem('playerName',name);
 localStorage.setItem(
 'quizInProgress',
 'true'
);
 const easyQuestions =
shuffle(
  allQuestions.filter(
    q => q.category === "Easy"
  )
).slice(0,2);

const normalQuestions =
shuffle(
  allQuestions.filter(
    q => q.category === "Normal"
  )
).slice(0,2);

const hardQuestions =
shuffle(
  allQuestions.filter(
    q => q.category === "Hard"
  )
).slice(0,2);

const insaneQuestions =
shuffle(
  allQuestions.filter(
    q => q.category === "Insane"
  )
).slice(0,2);

questions = [

  ...easyQuestions,

  ...normalQuestions,

  ...hardQuestions,

  ...insaneQuestions

];

 current = 0;
 score = 0;
 attempts = 0;

 showQuestion();
}function saveQuizState(){

 localStorage.setItem(
   'quizState',
   JSON.stringify({
     current,
     score,
     attempts,
     questions
   })
 );

}

function showQuestion() {

  const q = questions[current];
  const shuffledOptions =
shuffle(Object.entries(q.options));
  const calculatedPercentage = (current / TOTAL_QUESTIONS) * 100;

  document.getElementById('app').innerHTML = `
    <div class="progress-text">${current + 1}/${TOTAL_QUESTIONS}</div>
    <div class="progress-bar">
       <div class="progress-fill" style="width: ${calculatedPercentage}%"></div>
    </div>
    <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--coffee-light); font-weight:700; margin-bottom:5px;">
      ${q.category}
    </div>
    <h3>${q.question}</h3>
    <div id="options"></div>
  `;

  const optionsContainer = document.getElementById('options');
  shuffledOptions.forEach(([key, value]) => {
    optionsContainer.innerHTML += `
      <button data-key="${key}" onclick="checkAnswer('${key}', this)" style="text-align: left; padding-left: 20px;">
        <strong>${key}.</strong> ${value}
      </button>`;
  });

  showToast(randomItem(quizComments));
}

function checkAnswer(selected,btn){
 const correct = questions[current].correctAnswer;
 const buttons = document.querySelectorAll('#options button');
 buttons.forEach(b=>b.disabled=true);

 if(selected===correct){
   btn.classList.add('correct');
   score++;
 }else{
   btn.classList.add('wrong');
   buttons.forEach(b=>{
     if(b.dataset.key===correct){ b.classList.add('correct'); }
   });
 }

 setTimeout(()=>{
   current++;
   saveQuizState();
   if(current < TOTAL_QUESTIONS){ showQuestion(); }
   else{ showResult(); }
 },1200);
}

function retryQuiz(){
 const easyQuestions =
shuffle(
  allQuestions.filter(
    q => q.category === "Easy"
  )
).slice(0,2);

const normalQuestions =
shuffle(
  allQuestions.filter(
    q => q.category === "Normal"
  )
).slice(0,2);

const hardQuestions =
shuffle(
  allQuestions.filter(
    q => q.category === "Hard"
  )
).slice(0,2);

const insaneQuestions =
shuffle(
  allQuestions.filter(
    q => q.category === "Insane"
  )
).slice(0,2);

questions = [

  ...easyQuestions,

  ...normalQuestions,

  ...hardQuestions,

  ...insaneQuestions

];
 current = 0;
 score = 0;
 showQuestion();
}

function showResult(){
  localStorage.removeItem(
 'quizState'
);
  attempts++;
  savePlay();

  // Timestamp Generator
  const now = new Date();
  const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const dateString = now.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
  const timeStampHTML = `<div style="font-size: 12px; color: var(--text-light); margin-top: 20px; font-weight: 500;">${dateString} at ${timeString}</div>`;

  // 1. Win State
  if(score === TOTAL_QUESTIONS)
  localStorage.removeItem('quizInProgress');{
    localStorage.setItem('nextPlay', Date.now() + (10 * 1000));
    document.getElementById('app').innerHTML = `
      <h2>🏆 Coffee Master</h2>
      <div class="reward">Reward Unlocked 🎉</div>
      <p>Show this screen at the counter.</p>
      <div id="timer"></div>
      ${timeStampHTML}
    `;
    startTimer();
    return;
  }

  // 2. Retry State
  if(attempts < MAX_ATTEMPTS){
    document.getElementById('app').innerHTML = `
      <h2>Challenge Complete</h2>
      <div class="reward">${score}/${TOTAL_QUESTIONS}</div>
      <p>${randomItem(retryMessages)}</p>
      <button onclick="retryQuiz()">Try Again</button>
    `;
    return;
  }

  // 3. Fail State (Locked out)
  localStorage.setItem('nextPlay', Date.now() + (10 * 1000));
  document.getElementById('app').innerHTML = `
    <h2>Challenge Complete</h2>
    <div class="reward">${score}/${TOTAL_QUESTIONS}</div>
    <p>${randomItem(failMessages)}</p>
    <div id="timer"></div>
    ${timeStampHTML}
  `;
  startTimer();
}

function showCooldown(){
 document.getElementById('app').innerHTML = `
 <h2>See you soon 👋</h2>
 <p>Fresh questions unlock shortly.</p>
 <div id="timer"></div>
 `;
 startTimer();
}

function startTimer(){
 const interval=setInterval(()=>{
   const nextPlay = Number(localStorage.getItem('nextPlay'));
   const remaining = nextPlay - Date.now();

   if(remaining<=0){
     clearInterval(interval);
     localStorage.removeItem('nextPlay');
     const savedQuiz =
localStorage.getItem('quizState');

if(savedQuiz){

 const state =
 JSON.parse(savedQuiz);

 current = state.current;
 score = state.score;
 attempts = state.attempts;
 questions = state.questions;

 showQuestion();

}else{

 showHome();

}
     showHome();
     return;
   }

   const h = Math.floor(remaining / 3600000);
   const m = Math.floor((remaining % 3600000) / 60000);
   const s = Math.floor((remaining % 60000) / 1000);
   document.getElementById('timer').innerText = `${h}h ${m}m ${s}s`;
 },1000);
}

// Start the app
init();
</script>
</body>
</html>
