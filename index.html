<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vasasi Cafe Quiz</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">Loading Quiz Data Asset...</div>

<script>

const messages=[
["☕ Waiting for your order?","Let's make those few minutes worth it."],
["☕ Your coffee is brewing...","Ready for a quick challenge?"],
["⏳ Good coffee takes time.","Let's make the wait fun."],
["🎁 Got a minute?","You might unlock a reward."],
["☕ Fresh coffee. Fresh challenge.","Let's begin."],
["✨ A little challenge while you wait.","Your reward might be closer than you think."]
];

// Managed dynamically from external JSON payload
let allQuestions=[];
let questions=[];
let current=0;
let score=0;

// Initialize and pull JSON asset locally asynchronously
async function initQuizEngine() {
try {
const response = await fetch('questions.json');
if (!response.ok) throw new Error('Data payload missing.');
allQuestions = await response.json();
showHome();
} catch (error) {
document.getElementById("app").innerHTML = `<h2>⚠️ Error: Missing questions.json in the project root directory.</h2>`;
console.error(error);
}
}

// Fisher-Yates shuffle engine to prevent pattern predictability 
function shuffle(arr){
for (let i = arr.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[arr[i], arr[j]] = [arr[j], arr[i]];
}
return arr;
}

function showHome(){
const nextPlay=localStorage.getItem("nextPlay");

if(nextPlay && Date.now()<Number(nextPlay)){
showCooldown();
return;
}

const msg=messages[Math.floor(Math.random()*messages.length)];

document.getElementById("app").innerHTML=`
<div class="cafe">☕ Vasasi</div>
<div class="tag">Exclusive Cafe Challenge</div>

<h2>${msg[0]}</h2>
<p>${msg[1]}</p>

<button onclick="showNamePage()">Continue</button>
`;
}

function showNamePage(){
const saved=localStorage.getItem("playerName")||"";

document.getElementById("app").innerHTML=`
<div class="cafe">☕ Vasasi</div>

<h2>👋 What's your name?</h2>

<input id="name" placeholder="Enter your name" value="${saved}">

<button onclick="startQuiz()">Start Quiz</button>
`;
}

function startQuiz(){
const name=document.getElementById("name").value.trim();

if(name===""){
alert("Please enter your name");
return;
}

localStorage.setItem("playerName",name);

// Slices a random 3-question set out of the 100 available choices
questions=shuffle([...allQuestions]).slice(0,3);
current=0;
score=0;

showQuestion();
}

function showQuestion(){
let q=questions[current];
let optionKeys=Object.keys(q.options);

let html=`
<div class="cafe">☕ Vasasi</div>
<div class="category-tag">${q.category}</div>
<h3>Question ${current+1}/3</h3>
<p style="text-align: left; font-weight: 600; line-height: 1.4; color: #2d1b12;">${q.question}</p>
`;

optionKeys.forEach(key=>{
html+=`<button class="option-btn" data-key="${key}" onclick="checkAnswer('${key}',this)"><strong>${key}.</strong> ${q.options[key]}</button>`;
});

document.getElementById("app").innerHTML=html;
}

function checkAnswer(selectedKey,btn){
let correctKey=questions[current].correctAnswer;
let buttons=document.querySelectorAll("#app button");

buttons.forEach(b=>b.disabled=true);

if(selectedKey===correctKey){
btn.classList.add("correct");
score++;
}else{
btn.classList.add("wrong");

buttons.forEach(b=>{
if(b.getAttribute("data-key")===correctKey){
b.classList.add("correct");
}
});
}

setTimeout(()=>{
current++;

if(current<questions.length){
showQuestion();
}else{
showResult();
}
},1200);
}

function showResult(){
let reward="Try Again 😅";

if(score===3) reward="Double Shot Upgrade! 🎫🎉";
else if(score===2) reward="₹10 OFF 👍";

// Set to a realistic 24-hour lock out cycle to protect operational margins
localStorage.setItem(
"nextPlay",
Date.now() + (10 * 1000)
);

const name=localStorage.getItem("playerName")||"Friend";

document.getElementById("app").innerHTML=`
<div class="cafe">☕ Vasasi</div>

<h2>🎉 Nice one, ${name}!</h2>

<p>You scored ${score}/3</p>

<div class="reward">${reward}</div>

<p><strong>☕ A little treat from us.</strong></p>

<p>Show this screen at the counter to claim your reward.</p>

<p>⏰ Next challenge unlocks in:</p>

<div id="timer"></div>
`;

startTimer();
}

function showCooldown(){
const name=localStorage.getItem("playerName")||"Friend";

document.getElementById("app").innerHTML=`
<div class="cafe">☕ Vasasi</div>

<h2>Welcome back, ${name}!</h2>

<p>Your next challenge unlocks in:</p>

<div id="timer"></div>
`;

startTimer();
}

function startTimer(){
const interval=setInterval(()=>{
const nextPlay=Number(localStorage.getItem("nextPlay"));
const remaining=nextPlay-Date.now();

if(remaining<=0){
clearInterval(interval);
localStorage.removeItem("nextPlay");
showHome();
return;
}

const h=Math.floor(remaining/3600000);
const m=Math.floor((remaining%3600000)/60000);
const s=Math.floor((remaining%60000)/1000);

document.getElementById("timer").innerText=`${h}h ${m}m ${s}s`;
},1000);
}

// Global invocation entry point
initQuizEngine();

</script>

</body>
</html>
