<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VASASI Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="brand">VASASI</div>
<div id="app">Loading...</div>

<script>
const messages=[
["Waiting for your order?","Let's make those few minutes worth it."],
["Your coffee is brewing...","Ready for a quick challenge?"],
["Good coffee takes time.","Let's make the wait fun."],
["Fresh coffee. Fresh challenge.","Let's begin."]
];

let allQuestions=[];
let questions=[];
let current=0;
let score=0;

async function initQuizEngine(){
 try{
  const response=await fetch('questions.json');
  allQuestions=await response.json();
  showHome();
 }catch(e){
  document.getElementById('app').innerHTML='<h2>questions.json not found</h2>';
 }
}

function shuffle(arr){
 return [...arr].sort(()=>Math.random()-0.5);
}

function showHome(){
 const nextPlay=localStorage.getItem('nextPlay');
 if(nextPlay && Date.now()<Number(nextPlay)){
   showCooldown();
   return;
 }

 const msg=messages[Math.floor(Math.random()*messages.length)];

 document.getElementById('app').innerHTML=`
 <h2>${msg[0]}</h2>
 <p>${msg[1]}</p>
 <button onclick="showNamePage()">Start</button>
 `;
}

function showNamePage(){
 const saved=localStorage.getItem('playerName')||'';

 document.getElementById('app').innerHTML=`
 <h2>What's your name?</h2>
 <input id="name" placeholder="Your name" value="${saved}">
 <button onclick="startQuiz()">Continue</button>
 `;
}

function startQuiz(){
 const name=document.getElementById('name').value.trim();

 if(!name){
   alert('Enter your name');
   return;
 }

 localStorage.setItem('playerName',name);

 questions=shuffle(allQuestions).slice(0,3);
 current=0;
 score=0;

 showQuestion();
}

function showQuestion(){
 const q=questions[current];
 const keys=Object.keys(q.options);

 let html=`
 <h3>${current+1}/3</h3>
 <p>${q.question}</p>
 `;

 keys.forEach(key=>{
   html+=`<button data-key="${key}" onclick="checkAnswer('${key}',this)"><b>${key}.</b> ${q.options[key]}</button>`;
 });

 document.getElementById('app').innerHTML=html;
}

function checkAnswer(selected,btn){
 const correct=questions[current].correctAnswer;
 const buttons=document.querySelectorAll('#app button');

 buttons.forEach(b=>b.disabled=true);

 if(selected===correct){
   btn.classList.add('correct');
   score++;
 }else{
   btn.classList.add('wrong');
   buttons.forEach(b=>{
     if(b.dataset.key===correct) b.classList.add('correct');
   });
 }

 setTimeout(()=>{
  current++;
  if(current<questions.length) showQuestion();
  else showResult();
 },1000);
}

function showResult(){
 let reward='Try Again 😅';
 if(score===3) reward='Double Shot Upgrade! 🎉';
 else if(score===2) reward='₹10 OFF';

 localStorage.setItem('nextPlay', Date.now() + (10*1000));

 document.getElementById('app').innerHTML=`
 <h2>Reward Unlocked</h2>
 <div class="reward">${reward}</div>
 <p>Show this screen at the counter.</p>
 <div id="timer"></div>
 `;

 startTimer();
}

function showCooldown(){
 const name=localStorage.getItem('playerName')||'Friend';

 document.getElementById('app').innerHTML=`
 <h2>Welcome back, ${name}!</h2>
 <p>Next challenge in</p>
 <div id="timer"></div>
 `;

 startTimer();
}

function startTimer(){
 const interval=setInterval(()=>{
  const nextPlay=Number(localStorage.getItem('nextPlay'));
  const remaining=nextPlay-Date.now();

  if(remaining<=0){
   clearInterval(interval);
   localStorage.removeItem('nextPlay');
   showHome();
   return;
  }

  const s=Math.floor((remaining/1000)%60);
  document.getElementById('timer').innerText=`${s}s`;
 },1000);
}

initQuizEngine();
</script>

</body>
</html>
