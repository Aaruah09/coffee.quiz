<!DOCTYPE html>
<html>
<head>
  <title>Coffee Quiz ☕</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f5f5f5, #e6d3c3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #app {
      background: white;
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h2, h3 {
      color: #333;
    }

    p {
      color: #777;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-sizing: border-box;
      font-family: Poppins;
    }

    button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      background: #6f4e37;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #5a3e2b;
    }

    button:active {
      transform: scale(0.97);
    }

    .correct {
      background: #4CAF50 !important;
    }

    .wrong {
      background: #f44336 !important;
    }
  </style>
</head>

<body>

<div id="app"></div>

<script>

let allQuestions = [
  { q: "Espresso is?", options: ["Strong coffee", "Cold drink", "Tea"], answer: "Strong coffee" },
  { q: "Which coffee has more milk?", options: ["Latte", "Espresso", "Black coffee"], answer: "Latte" },
  { q: "Coffee was first discovered in?", options: ["India", "Ethiopia", "USA"], answer: "Ethiopia" },
  { q: "Cold brew is served?", options: ["Hot", "Cold", "Frozen"], answer: "Cold" },
  { q: "Which is strongest?", options: ["Americano", "Espresso", "Latte"], answer: "Espresso" },
  { q: "Cappuccino contains?", options: ["Milk foam", "Ice cream", "Chocolate only"], answer: "Milk foam" }
];

function shuffle(arr) {
  return arr.sort(() => Math.random() - 0.5);
}

function getRandomQuestions() {
  return shuffle([...allQuestions]).slice(0, 3);
}

let questions = [];
let current = 0;
let score = 0;

let playerName = "";
let playerMobile = "";

function showStart() {
  document.getElementById("app").innerHTML = `
    <h2>☕ Coffee Quiz</h2>
    <p>Enter your details to play</p>

    <input
      id="name"
      type="text"
      placeholder="Your Name"
    >

    <input
      id="mobile"
      type="tel"
      maxlength="10"
      placeholder="Mobile Number"
    >

    <button onclick="startQuiz()">Start Quiz</button>
  `;
}

function startQuiz() {

  playerName = document.getElementById("name").value.trim();
  playerMobile = document.getElementById("mobile").value.trim();

  if(playerName === "") {
    alert("Please enter your name");
    return;
  }

  if(!/^[0-9]{10}$/.test(playerMobile)) {
    alert("Please enter a valid 10-digit mobile number");
    return;
  }

  questions = getRandomQuestions();
  current = 0;
  score = 0;

  showQuestion();
}

function showQuestion() {

  let q = questions[current];
  let options = shuffle([...q.options]);

  let optionsHTML = "";

  options.forEach(opt => {
    optionsHTML += `
      <button onclick="checkAnswer('${opt}', this)">
        ${opt}
      </button>
    `;
  });

  document.getElementById("app").innerHTML = `
    <h3>Question ${current + 1}/3</h3>
    <p>${q.q}</p>
    ${optionsHTML}
  `;
}

function checkAnswer(selected, btn) {

  let correctAnswer = questions[current].answer;

  let buttons = document.querySelectorAll("button");

  buttons.forEach(b => b.disabled = true);

  if(selected === correctAnswer) {

    btn.classList.add("correct");
    score++;

  } else {

    btn.classList.add("wrong");

    buttons.forEach(b => {
      if(b.innerText === correctAnswer) {
        b.classList.add("correct");
      }
    });
  }

  setTimeout(() => {

    current++;

    if(current < questions.length) {
      showQuestion();
    } else {
      showResult();
    }

  }, 800);
}

function showResult() {

  let reward = "";

  if(score === 3) {
    reward = "₹10 OFF 🎉";
  }
  else if(score === 2) {
    reward = "₹5 OFF 👍";
  }
  else {
    reward = "Try Again 😅";
  }

  document.getElementById("app").innerHTML = `
    <h2>🔥 You scored ${score}/3</h2>

    <p><strong>Name:</strong> ${playerName}</p>
    <p><strong>Mobile:</strong> ${playerMobile}</p>

    <h3>${reward}</h3>

    <button onclick="showStart()">
      Play Again
    </button>
  `;
}

showStart();

</script>

</body>
</html>
