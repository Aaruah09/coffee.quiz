<script>

let playerName = "";
let playerPhone = "";

// 🟢 Start screen
function showStart() {
  document.getElementById("app").innerHTML = `
    <h2>☕ Coffee Quiz</h2>
    <p>Enter your details to play</p>

    <input
      id="playerName"
      type="text"
      placeholder="Your Name"
      style="width:100%;padding:12px;margin-bottom:10px;border:1px solid #ccc;border-radius:10px;"
    >

    <input
      id="playerPhone"
      type="tel"
      maxlength="10"
      placeholder="Mobile Number"
      style="width:100%;padding:12px;margin-bottom:15px;border:1px solid #ccc;border-radius:10px;"
    >

    <button onclick="validateAndStart()">Start Quiz</button>
  `;
}

function validateAndStart() {

  playerName = document.getElementById("playerName").value.trim();
  playerPhone = document.getElementById("playerPhone").value.trim();

  if (playerName.length < 2) {
    alert("Please enter your name");
    return;
  }

  if (!/^[0-9]{10}$/.test(playerPhone)) {
    alert("Please enter a valid 10-digit mobile number");
    return;
  }

  startQuiz();
}

// 🚀 Start quiz
function startQuiz() {
  questions = getRandomQuestions();
  current = 0;
  score = 0;

  showQuestion();
}

</script>
